name: Build Libraries Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (empty = run artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triplet: x86_64-linux-gnu
            libc: gnu
          - os: ubuntu-22.04-arm
            triplet: aarch64-linux-gnu
            libc: gnu
          - os: ubuntu-22.04
            triplet: x86_64-linux-musl
            libc: musl
          - os: ubuntu-22.04-arm
            triplet: aarch64-linux-musl
            libc: musl

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (apt)
        if: matrix.libc == 'gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libasound2-dev libpulse-dev

      - name: Build (glibc)
        if: matrix.libc == 'gnu'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLVISKIT_STATIC_RUNTIME=ON
          cmake --build build --config Release --target glviskit_c -j

      # NOTE: validate this apk list on the first musl run; package names
      # occasionally differ from the Debian set above.
      - name: Build (musl, Alpine via docker)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.21 sh -c '
            git config --global --add safe.directory "*" &&
            apk add --no-cache \
              build-base cmake git linux-headers \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
              libxfixes-dev libxkbcommon-dev wayland-dev wayland-protocols \
              mesa-dev libdrm-dev eudev-dev alsa-lib-dev pulseaudio-dev &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLVISKIT_STATIC_RUNTIME=ON &&
            cmake --build build --config Release --target glviskit_c -j'

      - name: Package
        run: tar -C build -czf "glviskit_c-${{ matrix.triplet }}.tar.gz" libglviskit_c.so

      - name: Upload run artifact
        uses: actions/upload-artifact@v7
        with:
          name: glviskit_c-${{ matrix.triplet }}
          path: glviskit_c-${{ matrix.triplet }}.tar.gz

      - name: Attach to release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: glviskit_c-${{ matrix.triplet }}.tar.gz
