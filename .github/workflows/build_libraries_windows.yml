name: Build Libraries Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (empty = run artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: x86_64-w64-mingw32
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLVISKIT_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Release --target glviskit_c -j

      - name: Package
        shell: bash
        run: tar -C build/Release -czf "glviskit_c-x86_64-w64-mingw32.tar.gz" glviskit_c.dll

      - name: Upload run artifact
        uses: actions/upload-artifact@v7
        with:
          name: glviskit_c-x86_64-w64-mingw32
          path: glviskit_c-x86_64-w64-mingw32.tar.gz

      - name: Attach to release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: glviskit_c-x86_64-w64-mingw32.tar.gz
