name: Test Julia Linux

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: julia

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build + software GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dri libegl-mesa0 libegl1 libgles2 libglx-mesa0

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build glviskit_c
        run: julia --project=. build_local.jl

      - name: Test
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: julia --project=. test/runtests.jl
