name: Build Libraries macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (empty = run artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.triplet }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: aarch64-apple-darwin
            arch: arm64
            osx_target: "11.0"
          - triplet: x86_64-apple-darwin
            arch: x86_64
            osx_target: "10.13"

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLVISKIT_STATIC_RUNTIME=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.osx_target }}

      - name: Build
        run: cmake --build build --config Release --target glviskit_c -j

      - name: Package
        run: tar -C build -czf "glviskit_c-${{ matrix.triplet }}.tar.gz" libglviskit_c.dylib

      - name: Upload run artifact
        uses: actions/upload-artifact@v7
        with:
          name: glviskit_c-${{ matrix.triplet }}
          path: glviskit_c-${{ matrix.triplet }}.tar.gz

      - name: Attach to release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: glviskit_c-${{ matrix.triplet }}.tar.gz
